<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HackBar Split View</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #f5f7fb;
      --panel-border: #d8deea;
      --text: #1a2333;
      --muted: #6c7689;
      --accent: #126bff;
      --accent-soft: #dce9ff;
      --danger: #d63c3c;
      --topbar: #121721;
      --topbar-border: #232a36;
      --iframe-bg: #07090d;
      --chip: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
    }

    .app {
      --top-pane-height: 58vh;
      --divider-height: 0px;
      display: grid;
      grid-template-rows: minmax(160px, var(--top-pane-height)) var(--divider-height) minmax(160px, 1fr);
      height: 100vh;
      width: 100vw;
    }

    .preview {
      position: relative;
      background: linear-gradient(180deg, #121722 0%, #07090d 100%);
      overflow: hidden;
    }

    .divider {
      position: relative;
      cursor: row-resize;
      height: 0;
      min-height: 0;
      background: transparent;
      border: 0;
      user-select: none;
      touch-action: none;
      z-index: 20;
    }

    .divider::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -8px;
      height: 16px;
    }

    .frame-wrap {
      position: absolute;
      inset: 0;
      background: var(--iframe-bg);
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .hackbar {
      min-height: 0;
      display: block;
      background: #eef1f5;
      overflow: hidden;
    }

    .hackbar-frame {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 0;
    }

    .hackbar-fallback {
      display: none;
      margin: 14px;
      padding: 12px 14px;
      border: 1px solid #f0b27a;
      border-radius: 10px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 1100px) {
      .app {
        --top-pane-height: 50vh;
      }

    }
  </style>
</head>
<body>
  <div class="app">
    <section class="preview">
      <div class="frame-wrap">
        <iframe id="targetFrame" src="https://mei-you-qian.github.io/page/3/#board" title="target website" loading="eager"></iframe>
      </div>
    </section>
    <div id="divider" class="divider" role="separator" aria-orientation="horizontal" aria-label="Resize panes"></div>

    <section class="hackbar">
      <iframe
        id="hackbarFrame"
        class="hackbar-frame"
        title="HackBar panel"
      ></iframe>
      <div id="hackbarFallback" class="hackbar-fallback">HackBar panel failed to load. Open this page via local HTTP instead of file://.</div>
    </section>
  </div>

  <script>
    const targetFrame = document.getElementById("targetFrame");
    const hackbarFrame = document.getElementById("hackbarFrame");
    const hackbarFallback = document.getElementById("hackbarFallback");
    const divider = document.getElementById("divider");
    const app = document.querySelector(".app");
    let currentRequest = {
      method: "GET",
      url: "https://mei-you-qian.github.io/page/3/#board",
      body: {
        content: "id=1",
        enctype: "application/x-www-form-urlencoded"
      },
      headers: [{"enabled": true, "name": "User-Agent", "value": "Mozilla/5.0"}, {"enabled": true, "name": "Accept", "value": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"}],
      followRedirect: false
    };
    let targetLoaded = false;
    let hackbarLoaded = false;
    let dragging = false;

    function loadFrame(url) {
      targetLoaded = false;
      syncCaptureState();
      targetFrame.src = url;
    }

    function syncCaptureState() {
      document.body.dataset.targetLoaded = targetLoaded ? "1" : "0";
      document.body.dataset.hackbarLoaded = hackbarLoaded ? "1" : "0";
      document.body.dataset.captureReady = targetLoaded && hackbarLoaded ? "1" : "0";
    }

    function submitPostToFrame(request) {
      targetLoaded = false;
      syncCaptureState();
      const form = document.createElement("form");
      form.method = "POST";
      form.action = request.url;
      form.target = "targetFrame";
      form.style.display = "none";

      const params = new URLSearchParams(request.body?.content || "");
      for (const [key, value] of params.entries()) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = key;
        input.value = value;
        form.appendChild(input);
      }

      document.body.appendChild(form);
      targetFrame.name = "targetFrame";
      form.submit();
      form.remove();
    }

    function applyHackbarRequest(request, action) {
      if (!request || !request.url) {
        return;
      }

      currentRequest = {
        ...currentRequest,
        ...request
      };

      if (action === "execute" && String(request.method).toUpperCase() === "POST") {
        submitPostToFrame(currentRequest);
        return;
      }

      loadFrame(currentRequest.url);
    }

    const hackbarHttpUrl = "./HackBar-chrome/mock-main.html";
    const hackbarSrc = hackbarHttpUrl;

    hackbarFrame.addEventListener("load", () => {
      hackbarLoaded = true;
      hackbarFallback.style.display = "none";
      syncCaptureState();
      try {
        hackbarFrame.contentWindow.postMessage({
          source: "split-view-parent",
          type: "sync-request",
          data: currentRequest
        }, "*");
      } catch (_) {}
    });

    hackbarFrame.addEventListener("error", () => {
      hackbarLoaded = false;
      syncCaptureState();
      hackbarFallback.style.display = "block";
    });

    targetFrame.addEventListener("load", () => {
      targetLoaded = true;
      syncCaptureState();
    });

    function setTopPaneHeight(nextPx) {
      const appRect = app.getBoundingClientRect();
      const minTop = 160;
      const minBottom = 160;
      const dividerHeight = divider.getBoundingClientRect().height || 10;
      const maxTop = appRect.height - dividerHeight - minBottom;
      const clamped = Math.max(minTop, Math.min(nextPx, maxTop));
      app.style.setProperty("--top-pane-height", `${clamped}px`);
    }

    divider.addEventListener("pointerdown", (event) => {
      dragging = true;
      divider.setPointerCapture(event.pointerId);
      document.body.style.cursor = "row-resize";
      document.body.style.userSelect = "none";
    });

    divider.addEventListener("pointermove", (event) => {
      if (!dragging) {
        return;
      }
      const appRect = app.getBoundingClientRect();
      setTopPaneHeight(event.clientY - appRect.top);
    });

    function stopDrag(event) {
      if (!dragging) {
        return;
      }
      dragging = false;
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
      if (event && divider.hasPointerCapture(event.pointerId)) {
        divider.releasePointerCapture(event.pointerId);
      }
    }

    divider.addEventListener("pointerup", stopDrag);
    divider.addEventListener("pointercancel", stopDrag);

    hackbarFrame.src = hackbarSrc;
    syncCaptureState();

    window.setTimeout(() => {
      try {
        const loaded = hackbarFrame.contentWindow && hackbarFrame.contentDocument && hackbarFrame.contentDocument.body;
        if (!loaded || hackbarFrame.contentDocument.body.children.length === 0) {
          hackbarFallback.style.display = "block";
        }
      } catch (_) {
        hackbarFallback.style.display = "block";
      }
    }, 1500);

    window.addEventListener("message", (event) => {
      if (event.source !== hackbarFrame.contentWindow) {
        return;
      }

      const message = event.data;
      if (!message || message.source !== "hackbar-mock") {
        return;
      }

      if (message.type === "load" || message.type === "execute") {
        applyHackbarRequest(message.data, message.type);
      }
    });
  </script>
</body>
</html>
